<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog vectors</title>
    <style>
      :root { --bg:#0b1120; --panel:#131c31; --line:#29344f; --ink:#eef2fb; --muted:#9aa8c7; --accent:#10a37f; }
      * { box-sizing: border-box; }
      body { margin:0; background: radial-gradient(1200px 700px at 70% -10%, #16233f 0%, var(--bg) 55%); color: var(--ink); font-family: system-ui, sans-serif; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px; }
      .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .16em; font-size: 12px; margin: 0; }
      h1 { margin: 6px 0 4px; font-size: 28px; }
      .sub { color: var(--muted); margin: 0 0 24px; }
      form { display: flex; gap: 10px; margin-bottom: 8px; }
      input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 14px 16px; border-radius: 12px; font: inherit; }
      button { background: var(--accent); color: #071b16; border: 0; font: inherit; font-weight: 700; padding: 14px 22px; border-radius: 12px; cursor: pointer; }
      .meta { color: var(--muted); font-size: 13px; min-height: 20px; margin: 6px 2px 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: grid; gap: 6px; }
      .row { display: flex; align-items: center; gap: 10px; }
      .title { font-weight: 600; }
      .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
      .date { color: var(--muted); font-size: 12px; margin-left: auto; }
      .bar { height: 6px; background: #1b2740; border-radius: 4px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .score { font-family: ui-monospace, monospace; color: var(--accent); font-size: 12px; }
      a.src { color: var(--accent); font-size: 12px; text-decoration: none; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">Vectors built from MongoDB changelogs</p>
      <h1>Ask the changelog in plain English</h1>
      <p class="sub">One $vectorSearch over release notes embedded as vectors. Matched by meaning, not keywords.</p>
      <form id="f">
        <input id="q" placeholder="e.g. queryable encryption, slot based execution, time series" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div class="meta" id="meta"></div>
      <div id="results"></div>
    </div>
    <script>
      const f = document.getElementById('f'), q = document.getElementById('q');
      const meta = document.getElementById('meta'), results = document.getElementById('results');
      async function run(text) {
        meta.textContent = 'Running $vectorSearch…'; results.innerHTML = '';
        const r = await fetch('/api/changelog/search', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
        if (!r.ok) { meta.textContent = 'Search unavailable (start and seed the changelog collection).'; return; }
        const data = await r.json();
        meta.textContent = data.results.length + ' changelog sections · ' + data.durationMs + ' ms';
        results.innerHTML = data.results.map(function(h){
          var pct = Math.round(h.score * 100);
          return '<div class="card"><div class="row"><span class="title">' + h.title + '</span>' +
            (h.version ? '<span class="badge">v' + h.version + '</span>' : '') +
            (h.date ? '<span class="date">' + h.date + '</span>' : '') + '</div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="row"><span class="score">' + h.score.toFixed(3) + '</span>' +
            (h.url ? '<a class="src" href="' + h.url + '" target="_blank" rel="noreferrer">' + h.url.replace('https://www.mongodb.com','') + '</a>' : '') +
            '</div></div>';
        }).join('');
      }
      f.addEventListener('submit', function(e){ e.preventDefault(); if (q.value.trim()) run(q.value.trim()); });
    </script>
  </body>
</html>
